name: karov
services:
  relay:
    build:
      context: ../..
      dockerfile: support/Dockerfile
    image: karov-relay:1.4.8
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 192m
    pids_limit: 80
    ports:
      - "127.0.0.1:18788:8788"
    environment:
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?יש להגדיר כתובת HTTPS קבועה}
      ENROLLMENT_KEY_HASH: ${ENROLLMENT_KEY_HASH:-}
      ENROLLMENT_PASSWORD_VERIFIER: ${ENROLLMENT_PASSWORD_VERIFIER:-}
    volumes:
      - karov-data:/data
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "3"}
volumes:
  karov-data:

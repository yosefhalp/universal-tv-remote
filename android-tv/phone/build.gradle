plugins { id 'com.android.application' }
android {
    namespace 'org.yosef.karov.phone'
    compileSdk 36
    defaultConfig {
        applicationId 'org.yosef.karov.phone'
        minSdk 28
        targetSdk 36
        versionCode 1
        versionName '1.0.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    buildFeatures { buildConfig true }
    signingConfigs {
        release {
            if (System.getenv('KAROV_KEYSTORE')) {
                storeFile file(System.getenv('KAROV_KEYSTORE'))
                storePassword System.getenv('KAROV_STORE_PASSWORD')
                keyAlias 'karov'
                keyPassword System.getenv('KAROV_STORE_PASSWORD')
            }
        }
    }
    buildTypes { debug { applicationIdSuffix '.debug' }; release { signingConfig signingConfigs.release; minifyEnabled false } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    testOptions { unitTests.returnDefaultValues = true }
    testBuildType System.getenv('KAROV_TEST_RELEASE') ? 'release' : 'debug'
}
dependencies {
    implementation project(':protocol')
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'org.bouncycastle:bcprov-jdk18on:1.86'
    implementation 'androidx.activity:activity:1.10.1'
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    implementation 'com.google.zxing:core:3.5.3'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:rules:1.6.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
    androidTestImplementation 'junit:junit:4.13.2'
}

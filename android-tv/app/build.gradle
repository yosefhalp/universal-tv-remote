plugins { id 'com.android.application' }
android {
    namespace 'org.yosef.karov'
    compileSdk 36
    // אפשר לבנות גרסת מעבדה קודמת כדי לבדוק שדרוג אמיתי; ברירת המחדל היא גרסת ההפצה.
    defaultConfig { applicationId 'org.yosef.karov'; minSdk 28; targetSdk 36; versionCode = (project.findProperty('tvVersionCode') ?: '13').toInteger(); versionName = (project.findProperty('tvVersionName') ?: '1.4.1'); testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner' }
    buildFeatures { buildConfig true }
    signingConfigs {
        release {
            if (System.getenv('KAROV_KEYSTORE')) {
                storeFile file(System.getenv('KAROV_KEYSTORE'))
                storePassword System.getenv('KAROV_STORE_PASSWORD')
                keyAlias 'karov'
                keyPassword System.getenv('KAROV_STORE_PASSWORD')
            }
        }
    }
    buildTypes { debug { applicationIdSuffix '.debug' }; release { signingConfig signingConfigs.release; minifyEnabled false } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    testOptions { unitTests.returnDefaultValues = true }
    testBuildType System.getenv('KAROV_TEST_RELEASE') ? 'release' : 'debug'
}
dependencies {
    implementation project(':updates')
    implementation project(':protocol')
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.google.zxing:core:3.5.3'
    implementation 'org.bouncycastle:bcprov-jdk18on:1.86'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'junit:junit:4.13.2'
}
